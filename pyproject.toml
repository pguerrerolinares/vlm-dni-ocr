[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dni-vlm-pipeline"
version = "0.1.0"
description = "Local OCR + VLM pipeline for extracting structured data from Spanish DNI images."
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "DNI VLM Team" }
]
dependencies = [
  "torch",
  "transformers",
  "python-doctr",
  "Pillow",
  "opencv-python-headless",
]

[project.optional-dependencies]
api = [
  "fastapi",
  "uvicorn",
  "python-multipart",
  "httpx",
]
ui = [
  "gradio",
  "httpx",
]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
]

[project.scripts]
dni-pipeline = "dni_pipeline.adapters.cli:main"
dni-pipeline-server = "dni_pipeline.adapters.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["dni_pipeline*"]

[tool.setuptools.package-data]
dni_pipeline = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "--strict-markers"
testpaths = ["tests"]
